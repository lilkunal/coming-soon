<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kunal Varshney</title>
<meta name="description" content="Kunal Varshney builds websites, search optimisation and internal tools. This address goes live on 19 November 2026; the portfolio is at lilkunal.github.io until then.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://lilkunal.github.io/">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23FF7A3D'/%3E%3Cstop offset='1' stop-color='%23E02F6B'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cg fill='url(%23g)'%3E%3Crect x='8' y='14' width='18' height='18' rx='3' opacity='.6'/%3E%3Crect x='36' y='30' width='52' height='52' rx='8'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root { --bg:#15161a; --ink:#eceef1; --soft:#8f959d; --line:#2d313a; --o:#FF7A3D; --p:#E02F6B; color-scheme:dark; }
@media (prefers-color-scheme: light) { :root { --bg:#f6f6f4; --ink:#15161a; --soft:#5c636e; --line:#dcdde0; color-scheme:light; } }
* { box-sizing:border-box; margin:0; }
body { min-height:100svh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--ink);
  font-family:"DM Sans",system-ui,sans-serif; }
main { max-width:34rem; }
.mark { width:72px; height:72px; display:block; }
.mark .s { animation:pull 2.8s cubic-bezier(.25,1.2,.4,1) infinite; }
.mark .s2 { animation-delay:.14s } .mark .s3 { animation-delay:.28s }
@keyframes pull { 0%,8% { transform:translate(-14px,-14px) scale(.55); opacity:0 } 38%,100% { transform:none } }
@media (prefers-reduced-motion: reduce) { .mark .s { animation:none } }
h1 { font-family:"Space Grotesk",sans-serif; font-size:clamp(2rem,7vw,3rem); letter-spacing:-.02em; line-height:1.05; margin-top:28px; }
.role { color:var(--soft); margin-top:8px; }
.when { font-family:"IBM Plex Mono",monospace; font-size:.85rem; margin-top:36px; padding-top:20px; border-top:1px solid var(--line); color:var(--soft); }
.when b { color:var(--ink); font-weight:500; }
a.go { display:inline-block; margin-top:22px; padding:12px 20px; border-radius:10px; color:#fff; text-decoration:none; font-weight:500;
  background:linear-gradient(120deg,var(--o),var(--p)); }
a.go:focus-visible { outline:2px solid var(--ink); outline-offset:3px; }
.mail { display:block; margin-top:18px; font-family:"IBM Plex Mono",monospace; font-size:.85rem; color:var(--soft); }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 96 96" role="img" aria-label="Pixel Pull mark">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF7A3D"/><stop offset="1" stop-color="#E02F6B"/></linearGradient></defs>
    <g fill="url(#g)">
      <rect class="s"    x="6"  y="10" width="8"  height="8"  rx="1.5" opacity=".32"/>
      <rect class="s s2" x="18" y="20" width="12" height="12" rx="2"   opacity=".55"/>
      <rect class="s s3" x="31" y="33" width="15" height="15" rx="2.5" opacity=".8"/>
      <rect x="50" y="28" width="40" height="40" rx="6"/>
    </g>
  </svg>
  <h1>Kunal Varshney</h1>
  <p class="role">Websites, search optimisation and internal tools.</p>
  <p class="when">This address opens on <b>19 November 2026</b><span id="left"></span>. The work is already live.</p>
  <a class="go" href="https://lilkunal.github.io/">See the portfolio &rarr;</a>
  <span class="mail">kunalvrshn@gmail.com</span>
</main>
<script>
  var d = Math.ceil((new Date("2026-11-19T00:00:00+05:30") - Date.now()) / 864e5);
  if (d > 0) document.getElementById("left").textContent = " · " + d + (d === 1 ? " day" : " days") + " to go";
</script>
</body>
</html>
