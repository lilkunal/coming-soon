<style>
:root { --o:#FF7A3D; --p:#E02F6B; --b:#4f8cff; --ink:#eceef1; --mute:#9aa1ac; --glass:rgba(12,13,16,.62); }
* { box-sizing:border-box; margin:0; }
[hidden] { display:none !important; }
html, body { height:100%; background:#0f1013; overflow:hidden; overscroll-behavior:none; color:var(--ink);
  font-family:"Chakra Petch",system-ui,sans-serif; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
canvas { display:block; position:fixed; inset:0; touch-action:none; }
button { font:inherit; color:inherit; cursor:pointer; }
button:focus-visible { outline:2px solid #fff; outline-offset:3px; }
kbd { display:inline-block; min-width:22px; padding:1px 6px; border:1px solid rgba(255,255,255,.28); border-bottom-width:2px;
  border-radius:4px; color:var(--ink); font:inherit; text-align:center; }

/* speech bubbles */
.say { position:fixed; z-index:3; pointer-events:none; white-space:nowrap; translate:-50% -100%;
  font:500 12px "IBM Plex Mono",monospace; background:#eceef1; color:#15161a; padding:5px 8px; border-radius:7px; }
.say::after { content:""; position:absolute; left:50%; bottom:-5px; translate:-50% 0;
  border:5px solid transparent; border-bottom:0; border-top-color:#eceef1; }
body.in-menu .say { display:none; }

/* preloader: one CSS robot, so it shows before any JavaScript arrives */
#boot { position:fixed; inset:0; z-index:20; background:#0f1013; display:grid; place-content:center; justify-items:center;
  gap:22px; transition:opacity .5s; font:500 13px "IBM Plex Mono",monospace; color:var(--mute); }
#boot.done { opacity:0; pointer-events:none; }
#boot .lbl { font:700 italic 14px "Chakra Petch",sans-serif; letter-spacing:.4em; color:var(--ink); }
.bot { position:relative; width:64px; height:96px; animation:bob .7s ease-in-out infinite alternate; }
.bot i { position:absolute; display:block; }
.bot .ant { left:30px; top:0; width:4px; height:14px; background:#5c636e; }
.bot .ant::after { content:""; position:absolute; left:-4px; top:-8px; width:12px; height:12px; border-radius:50%;
  background:var(--o); animation:blink 1.2s steps(2) infinite; }
.bot .head { left:4px; top:14px; width:56px; height:40px; border-radius:10px; background:linear-gradient(135deg,var(--o),var(--p)); }
.bot .eye { top:28px; width:10px; height:10px; border-radius:50%; background:#15161a; animation:look 2.4s ease-in-out infinite; }
.bot .eye.l { left:18px; } .bot .eye.r { left:36px; }
.bot .body { left:14px; top:58px; width:36px; height:24px; border-radius:6px; background:#3b4252; }
.bot .leg { top:82px; width:8px; height:14px; background:#3b4252; transform-origin:top; animation:step .35s infinite alternate; }
.bot .leg.l { left:20px; } .bot .leg.r { left:36px; animation-direction:alternate-reverse; }
@keyframes bob { to { transform:translateY(-6px); } }
@keyframes blink { 50% { background:#5c636e; } }
@keyframes look { 0%,40% { transform:translateX(0) } 50%,90% { transform:translateX(4px) } 100% { transform:translateX(0) } }
@keyframes step { from { transform:rotate(18deg) } to { transform:rotate(-18deg) } }
.bar { width:200px; height:4px; border-radius:2px; background:#2a2d35; overflow:hidden; }
.bar b { display:block; height:100%; width:8%; background:linear-gradient(90deg,var(--o),var(--p)); transition:width .25s; }

/* menus */
.screen { position:fixed; inset:0; z-index:8; display:grid; place-items:center; padding:24px;
  background:radial-gradient(ellipse at center, rgba(15,16,19,.25), rgba(15,16,19,.82)); }
.panel { text-align:center; max-width:640px; }
.kicker { font:500 12px "IBM Plex Mono",monospace; letter-spacing:.3em; text-transform:uppercase; color:var(--mute); }
.title { margin-top:8px; font-weight:700; font-style:italic; font-size:clamp(3.2rem,14vw,8rem); line-height:.86; letter-spacing:-.01em;

.menu { margin-top:34px; display:grid; gap:12px; justify-items:center; }
.btn { min-width:250px; padding:14px 28px; border:0; font-weight:700; font-size:1.05rem; letter-spacing:.14em; text-transform:uppercase;

  transition:transform .15s, filter .15s; }
.btn:hover, .btn:focus-visible { transform:translateY(-2px) scale(1.03); filter:brightness(1.12); outline:none; }
.btn.alt { background:rgba(255,255,255,.12); }
.btn.blue { background:linear-gradient(120deg,#4f8cff,#2a5bd7); }
.pick { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }

@media (max-width:700px) { body.match .brand { display:none; } #score { font-size:15px; left:16px; translate:none; } .icon { padding:0 9px; } }
#banner { position:fixed; inset:0; z-index:5; display:grid; place-items:center; pointer-events:none; }
#banner b { font-weight:700; font-style:italic; font-size:clamp(3.6rem,19vw,11rem); text-transform:uppercase; color:#fff;

@keyframes pop { 0% { transform:scale(.3) skewX(-8deg); opacity:0 } 14% { transform:scale(1.08) skewX(-8deg); opacity:1 }
  80% { transform:scale(1) skewX(-8deg); opacity:1 } 100% { transform:scale(1.4) skewX(-8deg); opacity:0 } }
#hint { position:fixed; left:50%; bottom:calc(16px + env(safe-area-inset-bottom, 0px)); translate:-50% 0; z-index:4;
  font:500 12px "IBM Plex Mono",monospace; color:var(--ink); background:var(--glass); padding:7px 12px; border-radius:4px;
  text-align:center; max-width:calc(100vw - 32px); pointer-events:none; }
#power { position:fixed; left:50%; bottom:calc(60px + env(safe-area-inset-bottom, 0px)); translate:-50% 0; width:220px; height:9px;
  background:rgba(255,255,255,.15); z-index:4; border-radius:2px; overflow:hidden; }
#power i { display:block; height:100%; width:0; background:linear-gradient(90deg,#f6c445,var(--o),var(--p)); }
#stick { position:fixed; left:calc(20px + env(safe-area-inset-left, 0px)); bottom:calc(22px + env(safe-area-inset-bottom, 0px));
  width:124px; height:124px; border-radius:50%; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.22);
  z-index:5; touch-action:none; }
#stick i { position:absolute; left:50%; top:50%; width:54px; height:54px; margin:-27px; border-radius:50%; background:rgba(255,255,255,.34); }
.pad { position:fixed; right:calc(16px + env(safe-area-inset-right, 0px)); bottom:calc(20px + env(safe-area-inset-bottom, 0px));
  z-index:5; display:grid; grid-template-columns:auto auto; gap:10px; align-items:end; justify-items:center; }
.pad button { width:62px; height:62px; border-radius:50%; border:1px solid rgba(255,255,255,.26); background:var(--glass);
  font-weight:700; font-size:11px; letter-spacing:.06em; text-transform:uppercase; touch-action:none; }

.pad button.on { background:rgba(255,255,255,.3); }

<script>
  (function () {
    var lines = ["waking the robots up", "mowing the pitch", "pumping up the ball", "switching on the floodlights",
      "overthinking the loading bar", "telling the DJ to turn it down", "almost. probably."], i = 0;
    var t = setInterval(function () {
      var b = document.getElementById("boot");
      if (!b || b.classList.contains("done")) return clearInterval(t);
      document.getElementById("bootline").textContent = lines[++i % lines.length];
    }, 1100);
    // if the 3D never arrives (CDN down, ancient phone), don't trap anyone on the loader
    setTimeout(function () {
      var b = document.getElementById("boot");
      if (!b || b.classList.contains("done")) return;   // it loaded fine
      b.classList.add("done");
      var m = document.getElementById("menu"); if (m) m.hidden = false;
    }, 20000);
  })();
</script>

<script type="module">
// Robot: "RobotExpressive" by Tomás Laulhé (CC0), from the three.js examples.
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import * as SkeletonUtils from "three/addons/utils/SkeletonUtils.js";
import { Sky } from "three/addons/objects/Sky.js";

const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const small = Math.min(innerWidth, innerHeight) < 700;
const touch = matchMedia("(pointer: coarse)").matches;
const clamp = THREE.MathUtils.clamp;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const angDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));

// the stadium, in metres-ish (a robot is about 2.3 tall)
const PL = 20, PW = 13;                    // pitch half-length, half-width
const GW = 3.2, GH = 2.6, GD = 1.8;        // goal half-width, height, depth
const BALL_R = 0.3;
const BX = PL + 2.4, BZ = PW + 1.8;        // the advertising boards that cage the ball
const GAP = 7, TIERS = 6, TIER_H = 0.7, TIER_D = 1.3;
const SIDE = BZ + 3.4, END = BX + 3.4;     // where the sideline robots live
const OUT_X = BX + GAP + TIERS * TIER_D, OUT_Z = BZ + GAP + TIERS * TIER_D;
const TEAMS = [{ name: "Orange", short: "ORG", color: 0xff7a3d, css: "#FF7A3D" }, { name: "Blue", short: "BLU", color: 0x4f8cff, css: "#4f8cff" }];
const A = t => (t === 0 ? 1 : -1);         // team 0 attacks +x, team 1 attacks -x
const RUN = 4.7, SPRINT = 6.6, CHASE = 5.4;

const LINES = {
  chill: ["what if CSS is... like, a feeling", "the cache is everywhere, man", "launch day is a state of mind",
    "ship it... tomorrow", "whoa. the floodlights.", "the pixels are breathing"],
  gamer: ["GG, stuartboi#0702 wins", "one more match", "lag!! that was lag", "my Steam library judges me",
    "T2 console, never forget", "I'd have scored that"],
  coder: ["who wrote this? oh. me.", "it compiled. I'm scared.", "undefined is not a function",
    "git push --force (sorry)", "just one more console.log", "stack overflow is down?!"],
  rage: ["RAGE QUIT", "why won't you CENTRE", "I hate CSS", "it worked 5 minutes ago!!"],
  dj: ["drop the bass", "this one's for the recruiters", "now playing: npm install", "half-time mix incoming"],
  sleeper: ["Z z z", "5 more minutes", "dreaming in hex", "zzz... deploy... zzz"],
  selfie: ["for the gram", "LinkedIn post incoming", "#opentowork", "thought leadership pose", "humbled to announce..."],
  runner: ["COFFEE!!", "deadline is TODAY", "can't stop, won't stop", "4th cup, who's counting"],
  courier: ["your catalogue, sir", "200 products, coming through", "mind the box", "signed, sealed, deployed"],
  pacer: ["did I lock the door?", "what if the recruiter saw the 404?", "should've said 'Regards'",
    "replaying that meeting from 2019", "did I hit reply all??"],
  texter: ["seen 3 hours ago", "typing... stopped typing", "should I double text?", "'k.' what does 'k.' mean",
    "they used a full stop. it's over."],
  decider: ["push it? no. yes. no.", "tabs or spaces... both?", "light mode? dark mode? ??", "ok final answer: maybe"],
  thinker: ["what if the domain expires", "is 7 KB too small??", "what if nobody scrolls", "but WHY did it work",
    "launch next week... or next year??"],
  spiral: ["but what if...", "hmm", "okay but what if", "spiralling, brb", "what if I'm the bug"],
  shoot: ["SHOOT!", "top bins", "for the highlights reel", "watch this"],
  save: ["not today", "nope", "my house", "too easy"],
  goal: ["GOAL!!", "SIUUU", "get in!!", "did you see that?!"],
  sad: ["the post!!", "VAR?!", "ref!!", "wind, obviously"],
  tackle: ["mine now", "clean tackle", "sorry not sorry"],
  hit: ["ow", "my pixels!", "rude", "I was compiling!", "bug report filed", "foul!!"],
  me: ["finally, freedom", "I have legs?!", "this is my moment", "where's the ball?"],
};

/* ---------- renderer, sky, light ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, small ? 1.6 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1800);
let portrait = innerWidth / innerHeight < 0.9;
const back = Math.max(1, 0.75 / camera.aspect);

// a sunset sky, which also lights everything through the environment map
const sky = new Sky();
sky.scale.setScalar(1000);
const su = sky.material.uniforms;
su.turbidity.value = 7; su.rayleigh.value = 2.4; su.mieCoefficient.value = 0.006; su.mieDirectionalG.value = 0.86;
const sunAz = THREE.MathUtils.degToRad(215);
su.sunPosition.value.setFromSphericalCoords(1, THREE.MathUtils.degToRad(84), sunAz);
scene.add(sky);
{
  const envScene = new THREE.Scene(), envSky = new Sky();
  envSky.material = sky.material; envSky.scale.setScalar(50); envScene.add(envSky);
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(envScene, 0.04).texture;
  scene.environmentIntensity = 0.55;
}
scene.fog = new THREE.Fog(0x8a7880, 120, 330);

scene.add(new THREE.HemisphereLight(0xbfcfff, 0x3e3329, 0.85));
// the sun sits low in the sky picture, but lights from higher up so the stands don't black out the pitch
const sun = new THREE.DirectionalLight(0xffd9b0, 2.2);
sun.position.setFromSphericalCoords(80, THREE.MathUtils.degToRad(58), sunAz);
sun.castShadow = true;
sun.shadow.mapSize.set(small ? 1024 : 2048, small ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -46, right: 46, top: 46, bottom: -46, near: 10, far: 200 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun);
const flood = new THREE.DirectionalLight(0xeaf0ff, 0.9);   // the floodlights, as one soft fill from the other side
flood.position.setFromSphericalCoords(80, THREE.MathUtils.degToRad(40), sunAz + Math.PI);
scene.add(flood);

const std = (color, rough = 0.85, metal = 0) => new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal });
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = maxAniso;
  return t;
}

/* ---------- the ground, the pitch and its markings ---------- */
const ground = new THREE.Mesh(new THREE.CircleGeometry(400, 64), std(0x3a3c41, 1));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

// mown stripes, a little noise, and every line painted straight onto the grass

function play(b, name, once, fade = 0.25) {
  const a = b.acts[name];
  a.reset(); a.timeScale = 1;
  a.setLoop(once ? THREE.LoopOnce : THREE.LoopRepeat);
  a.clampWhenFinished = once;
  a.fadeIn(fade).play();

}

// robots with a fixed spot and a habit; `every` = how often the habit kicks in
const SPEC = {
  gamer:   { clip: "Sitting" },
  chill:   { clip: "Sitting", sad: 0.55 },
  coder:   { clip: "Sitting", every: [9, 15], fit: () => "Punch", fitLines: "rage" },
  dj:      { clip: "Dance" },
  sleeper: { clip: "Death", once: true },
  selfie:  { clip: "Idle", every: [3, 6], fit: () => pick(["Wave", "ThumbsUp", "Yes"]) },
  texter:  { clip: "Sitting", sad: 0.4 },
  decider: { clip: "Idle", every: [1.8, 3], fit: () => pick(["Yes", "No"]) },
  thinker: { clip: "Sitting", sad: 1 },
};
const LOOPS = { runner: "Running", courier: "Walking", pacer: "Walking", spiral: "Walking" };

function resume(b) {
  calm(b); b.clip = "";
  if (b.role === "player") { b.state = "active"; return; }   // the football code picks the animation
  if (b.role === "me") { b.state = "me"; return; }
  if (LOOPS[b.role]) { b.state = "loop"; play(b, LOOPS[b.role], false); return; }
  const spec = SPEC[b.role];
  b.state = "sit"; b.heading = b.homeHeading; b.root.position.copy(b.home);
  play(b, spec.clip, !!spec.once);
  if (spec.sad) face(b, "Sad", spec.sad);
  if (spec.every) b.fitIn = rnd(...spec.every);
}
function act(b, name, ms) {
  b.state = "act";
  const looped = name === "Dance" || name === "Sitting";
  play(b, name, !looped);
  b.timer = ms || (looped ? rnd(2.5, 4.5) : 99);
}

  if (b.state === "down") return;
  if (b.fb && owner === b.fb) owner = null;
  b.state = "down"; b.timer = rnd(2, 2.8);
  face(b, "Surprised", 1);

function hold(b, prop) {
  const hand = b.root.getObjectByName("HandR") || b.root.getObjectByName("Hand.R");
  if (!hand) return prop;
  b.root.updateMatrixWorld(true);
  prop.scale.setScalar(1 / hand.getWorldScale(new THREE.Vector3()).x);
  hand.add(prop);

}

function makeBot({ role, color, pos, heading = 0, size = rnd(0.46, 0.54) }) {
  const root = SkeletonUtils.clone(robotGltf.scene);
  let head = null;
  root.traverse(o => {
    if (!o.isMesh) return;
    o.castShadow = true;
    o.material = o.material.clone();
    if (o.material.name === "Main") o.material.color = new THREE.Color(color);
    if (o.morphTargetDictionary && "Surprised" in o.morphTargetDictionary) head = o;
  });
  root.scale.setScalar(size);
  root.rotation.order = "YXZ";       // so a front flip is a flip, whichever way you face
  root.position.copy(pos);
  root.rotation.y = heading;
  scene.add(root);
  const mixer = new THREE.AnimationMixer(root), acts = {};
  for (const clip of robotGltf.animations) acts[clip.name] = mixer.clipAction(clip);
  const bubble = document.createElement("div");
  bubble.className = "say"; bubble.hidden = true; document.body.appendChild(bubble);
  const b = { root, mixer, acts, head, bubble, role, size, cur: null, heading, homeHeading: heading, home: pos.clone(),
    state: "", timer: 0, sayUntil: 0, talk: rnd(1, 7), clip: "" };
  root.userData.bot = b;
  mixer.addEventListener("finished", e => { if (e.action === b.cur && b.state === "act") resume(b); });
  bots.push(b);
  resume(b);
  mixer.update(rnd(0, 2));
  return b;
}

}

  p.z = clamp(p.z + f.vel.y * dt, -BZ + 0.5, BZ - 0.5);

  else if (owner === null || owner !== f) b.heading = Math.atan2(ball.position.x - p.x, ball.position.z - p.z);   // keep an eye on the ball

  if (moving && b.bumpCd <= 0) for (const o of bots) {
    if (o === b || o.state === "down" || SPEC[o.role]) continue;
    const dx = o.root.position.x - p.x, dz = o.root.position.z - p.z;
    if (dx * dx + dz * dz < 1.3 && Math.abs(p.y) < 0.6) {
      knockDown(o); b.bumpCd = 0.6;
      if (Math.random() < 0.4) say(b, pick(["sorry!", "coming through", "my bad", "watch it!"]), 1200);
      break;
    }
  }
  const bp = ball.position;
  if (Math.hypot(bp.x - p.x, bp.z - p.z) < 0.9 && Math.abs(bp.y - p.y) < 0.8) {
    if (owner) { const o = owner; owner = null; o.kickCd = 0.8; }
    bv.set(Math.sin(b.heading) * (sprint ? 15 : 9), sprint ? 3 : 1.2, Math.cos(b.heading) * (sprint ? 15 : 9));
    lastTouch = null; sfx.kick(sprint ? 0.7 : 0.4);
  }
}

const controls = new OrbitControls(camera, renderer.domElement);
Object.assign(controls, { enableDamping: true, enablePan: false, autoRotate: !still, autoRotateSpeed: 0.35,
  minDistance: 10, maxDistance: 110, maxPolarAngle: 1.36 });
const orbitStart = new THREE.Vector3(0, 21, 50).multiplyScalar(back);
camera.position.copy(orbitStart);
controls.target.set(0, 0, 0);
const camLook = new THREE.Vector3(), camGoal = new THREE.Vector3(), lookGoal = new THREE.Vector3();
let camStyle = "tv";
function updateCamera(dt) {
  if (mode === "menu" || mode === "watch") { controls.update(); camLook.copy(controls.target); return; }
  let k = 1 - Math.exp(-dt * 4);
  if (mode === "football") {
    const bx = ball.position.x, bz = ball.position.z;
    if (camStyle === "chase" && ctl) {
      const p = ctl.b.root.position, h = ctl.b.heading;
      yaw += angDiff(h + Math.PI, yaw) * (1 - Math.exp(-dt * 2.5));
      lookGoal.set(p.x, 1.4, p.z);
      camGoal.set(p.x + Math.sin(yaw) * 8, 4.2, p.z + Math.cos(yaw) * 8);
    } else if (portrait) {
      const s = A(game.human < 0 ? 0 : game.human);
      camGoal.set(bx - s * 19, 17, bz * 0.45); lookGoal.set(bx + s * 4, 0, bz * 0.6);
    } else {
      const cx = clamp(bx * 0.85, -PL + 5, PL - 5);
      camGoal.set(cx, 15, BZ + 15); lookGoal.set(cx, 0, bz * 0.3 - 1.5);
    }
  } else if (mode === "roam" && me) {
    const p = me.root.position;
    lookIdle += dt;
    // drift back behind the robot while you run forward and leave the mouse alone
    if (me.moving && lookIdle > 1.3) yaw += angDiff(me.heading + Math.PI, yaw) * (1 - Math.exp(-dt * 1.4));
    const d = touch ? 8 : 7;
    lookGoal.set(p.x, p.y + 1.6, p.z);
    camGoal.set(p.x + Math.sin(yaw) * Math.cos(pitch) * d, Math.max(0.6, p.y + 1.6 + Math.sin(pitch) * d), p.z + Math.cos(yaw) * Math.cos(pitch) * d);
    k = 1 - Math.exp(-dt * 12);
  }
  camera.position.lerp(camGoal, k);
  camLook.lerp(lookGoal, k);
  camera.lookAt(camLook);
}

    for (const t of ledTexs) t.needsUpdate = true;
  });
  renderer.compileAsync(scene, camera).catch(() => {}).then(() => {
    bar.style.width = "100%";
    show("menu");
    setTimeout(() => {
      const boot = document.getElementById("boot");
      boot.classList.add("done"); setTimeout(() => boot.remove(), 600);
      ui.main.querySelector("button").focus({ preventScroll: true });
    }, 120);
  });
}, e => { if (e.total) bar.style.width = 15 + 70 * e.loaded / e.total + "%"; },
  () => { document.getElementById("boot").classList.add("done"); ui.menu.hidden = false; });

/* ---------- the loop ---------- */
const clock = new THREE.Clock(), dummy = new THREE.Object3D(), proj = new THREE.Vector3();
let ticking = false, puffClock = 0, screenClock = 0, fanFrame = 0;
const puffGeo = new THREE.SphereGeometry(0.12, 10, 8);
function startLoop() { ticking = true; clock.getDelta(); requestAnimationFrame(tick); }
function tick() {
  if (still && mode === "menu") { ticking = false; render(); return; }
  requestAnimationFrame(tick);
  if (document.hidden) { clock.getDelta(); return; }
  const dt = Math.min(clock.getDelta(), 0.05), now = performance.now();

  if (footballers.length) updateMatch(dt);
  tackleCd -= dt;

  for (const b of bots) {
    b.timer -= dt; b.talk -= dt;
    const p = b.root.position;
    if (b.state === "me") drive(b, dt);
    else if (b.state === "sit") {
      if (b.talk <= 0) { say(b, pick(LINES[b.role]), 2600); b.talk = rnd(6, 12); }
      const spec = SPEC[b.role];
      if (spec.every && (b.fitIn -= dt) <= 0) {
        act(b, spec.fit());
        if (spec.fitLines) { face(b, "Angry", 1); say(b, pick(LINES[spec.fitLines]), 1800); }
      }
    } else if (b.state === "loop") {
      if (b.ang !== undefined) {
        b.ang += b.w * dt;
        p.set(b.home.x + Math.cos(b.ang) * b.rad, 0, b.home.z + Math.sin(b.ang) * b.rad);
        b.heading = Math.atan2(-Math.sin(b.ang), Math.cos(b.ang));
      } else {
        const t = b.toB ? b.b : b.home, dx = t.x - p.x, dz = t.z - p.z, d = Math.hypot(dx, dz);
        if (d < 0.3) { b.toB = !b.toB; say(b, pick(LINES[b.role]), 1800); }
        else { b.heading = Math.atan2(dx, dz); p.x += dx / d * b.v * dt; p.z += dz / d * b.v * dt; }
      }
      if (b.talk <= 0) { say(b, pick(LINES[b.role]), 1800); b.talk = rnd(7, 13); }
    } else if ((b.state === "act" || b.state === "down") && b.timer <= 0) resume(b);

    b.root.rotation.y += angDiff(b.heading, b.root.rotation.y) * Math.min(1, dt * 10);
    b.mixer.update(dt);

    if (!b.bubble.hidden) {
      if (now > b.sayUntil) b.bubble.hidden = true;
      else {
        proj.set(p.x, p.y + b.size * 5.4, p.z).project(camera);
        b.bubble.style.visibility = proj.z > 1 ? "hidden" : "visible";
        b.bubble.style.left = (proj.x + 1) / 2 * innerWidth + "px";
        b.bubble.style.top = (1 - proj.y) / 2 * innerHeight + "px";
      }
    }
  }

  // nobody stands inside anybody; robots with a fixed spot hold their ground
  for (let i = 0; i < bots.length; i++) for (let j = i + 1; j < bots.length; j++) {
    const a = bots[i], b = bots[j], pa = a.root.position, pb = b.root.position;
    const both = a.fb && b.fb, MIN = both ? 0.8 : 1.3;
    let dx = pb.x - pa.x, dz = pb.z - pa.z;
    const d = Math.hypot(dx, dz);
    if (d >= MIN || Math.abs(pa.y - pb.y) > 1) continue;
    const ma = !SPEC[a.role], mb = !SPEC[b.role];
    if (!ma && !mb) continue;
    if (d < 1e-3) { dx = 1; dz = 0; } else { dx /= d; dz /= d; }
    const push = MIN - Math.max(d, 1e-3), sa = ma && mb ? 0.5 : ma ? 1 : 0, sb = ma && mb ? 0.5 : mb ? 1 : 0;
    pa.x -= dx * push * sa; pa.z -= dz * push * sa; pb.x += dx * push * sb; pb.z += dz * push * sb;
  }

  // your marker
  if (ctl && mode === "football") {
    const p = ctl.b.root.position;
    ring.position.set(p.x, 0.04, p.z);
    arrow.position.set(p.x, 3.4 + Math.sin(now / 200) * 0.08, p.z);
  }

  // the crowd, louder after goals (every other frame is plenty)
  excite = Math.max(0, excite - dt * 0.25);
  if ((fanFrame++ & 1) === 0) {
    const amp = 0.04 + excite * 0.45;
    for (let i = 0; i < fans.length; i++) {
      const f = fans[i], y = Math.max(0, Math.sin(now / 230 + f.ph)) * amp * f.hop;
      dummy.position.set(f.x, f.y + 0.45 + y, f.z); dummy.updateMatrix(); fanBody.setMatrixAt(i, dummy.matrix);
      dummy.position.y = f.y + 0.95 + y; dummy.updateMatrix(); fanHead.setMatrixAt(i, dummy.matrix);
    }
    fanBody.instanceMatrix.needsUpdate = fanHead.instanceMatrix.needsUpdate = true;
  }
  for (const t of ledTexs) t.offset.x = (t.offset.x + dt * 0.04) % 1;

  // smoke off the joint
  puffClock -= dt;
  if (joint && puffClock <= 0 && puffs.length < 40) {
    puffClock = 0.22;
    const m = new THREE.Mesh(puffGeo, new THREE.MeshBasicMaterial({ color: 0xcfd3da, transparent: true, opacity: 0.55, depthWrite: false }));
    joint.getWorldPosition(m.position);
    m.userData.v = new THREE.Vector3(rnd(-0.15, 0.15), rnd(0.5, 0.8), rnd(-0.15, 0.15)); m.userData.age = 0;
    scene.add(m); puffs.push(m);
  }
  for (let i = puffs.length - 1; i >= 0; i--) {
    const m = puffs[i];
    m.userData.age += dt; m.position.addScaledVector(m.userData.v, dt);
    m.scale.setScalar(1 + m.userData.age * 2.2); m.material.opacity = 0.55 * (1 - m.userData.age / 3);
    if (m.userData.age > 3) { scene.remove(m); m.material.dispose(); puffs.splice(i, 1); }
  }
  for (const m of marks) {
    const a = now / 700 + m.phase, hp = m.of.root.position;
    m.q.position.set(hp.x + Math.cos(a) * 0.8, 3.1 + Math.sin(a * 2) * 0.15, hp.z + Math.sin(a) * 0.8);
  }
  if (rain.cloud) for (const d of rain.drops) {
    d.position.y -= 6 * dt;
    if (d.position.y < 0) d.position.set(rain.cloud.position.x + rnd(-0.6, 0.6), 3.3, rain.cloud.position.z + rnd(-0.35, 0.35));
  }
  screenClock -= dt;
  if (screenMat && screenClock <= 0) {
    screenClock = rnd(0.12, 0.4);
    screenMat.color.setHSL(Math.random(), 0.7, 0.55);
    for (const l of lights) l.material.color.setHSL(Math.random(), 0.9, 0.6);
  }

  updateCamera(dt);
  render();
}
function render() { renderer.render(scene, camera); }
if (still) render();
</script>
</body>
</html>
