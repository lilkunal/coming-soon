<style>
* { box-sizing:border-box; margin:0; }
html, body { height:100%; background:#15161a; overflow:hidden; overscroll-behavior:none; }
canvas { display:block; position:fixed; inset:0; touch-action:none; cursor:grab; }
canvas:active { cursor:grabbing; }
h1 { position:fixed; top:calc(8vh + env(safe-area-inset-top, 0px)); left:0; right:0; text-align:center; z-index:2; pointer-events:none;
  font-family:"Space Grotesk",system-ui,sans-serif; font-size:clamp(2.6rem,11vw,7rem); letter-spacing:-.03em;
  background:linear-gradient(120deg,#FF7A3D,#E02F6B); -webkit-background-clip:text; background-clip:text; color:transparent; }
.say { position:fixed; z-index:3; pointer-events:none; white-space:nowrap; translate:-50% -100%;
  font:500 12px "IBM Plex Mono",monospace; background:#eceef1; color:#15161a; padding:5px 8px; border-radius:7px; }
.say::after { content:""; position:absolute; left:50%; bottom:-5px; translate:-50% 0;
  border:5px solid transparent; border-bottom:0; border-top-color:#eceef1; }

/* preloader: one CSS robot, so it shows before any JavaScript arrives */
#boot { position:fixed; inset:0; z-index:10; background:#15161a; display:grid; place-content:center; justify-items:center;
  gap:22px; transition:opacity .5s; font:500 13px "IBM Plex Mono",monospace; color:#8f959d; }
#boot.done { opacity:0; pointer-events:none; }
.bot { position:relative; width:64px; height:96px; animation:bob .7s ease-in-out infinite alternate; }
.bot i { position:absolute; display:block; }
.bot .ant { left:30px; top:0; width:4px; height:14px; background:#5c636e; }
.bot .ant::after { content:""; position:absolute; left:-4px; top:-8px; width:12px; height:12px; border-radius:50%;
  background:#FF7A3D; animation:blink 1.2s steps(2) infinite; }
.bot .head { left:4px; top:14px; width:56px; height:40px; border-radius:10px; background:linear-gradient(135deg,#FF7A3D,#E02F6B); }
.bot .eye { top:28px; width:10px; height:10px; border-radius:50%; background:#15161a; animation:look 2.4s ease-in-out infinite; }
.bot .eye.l { left:18px; } .bot .eye.r { left:36px; }
.bot .body { left:14px; top:58px; width:36px; height:24px; border-radius:6px; background:#3b4252; }
.bot .leg { top:82px; width:8px; height:14px; background:#3b4252; transform-origin:top; animation:step .35s infinite alternate; }
.bot .leg.l { left:20px; } .bot .leg.r { left:36px; animation-direction:alternate-reverse; }
@keyframes bob { to { transform:translateY(-6px); } }
@keyframes blink { 50% { background:#5c636e; } }
@keyframes look { 0%,40% { transform:translateX(0) } 50%,90% { transform:translateX(4px) } 100% { transform:translateX(0) } }
@keyframes step { from { transform:rotate(18deg) } to { transform:rotate(-18deg) } }
.bar { width:180px; height:4px; border-radius:2px; background:#2a2d35; overflow:hidden; }
.bar b { display:block; height:100%; width:8%; background:linear-gradient(90deg,#FF7A3D,#E02F6B); transition:width .25s; }
@media (prefers-reduced-motion: reduce) { .bot, .bot * , .bot .ant::after { animation:none !important; } }

/* play mode */
#hud { position:fixed; left:0; right:0; bottom:calc(20px + env(safe-area-inset-bottom, 0px)); z-index:4; display:flex;
  flex-direction:column; align-items:center; gap:8px; pointer-events:none; font:500 12px "IBM Plex Mono",monospace; color:#c9cdd3; }
#hud button { pointer-events:auto; font:600 14px "Space Grotesk",system-ui,sans-serif; color:#fff; border:0; border-radius:999px;
  padding:11px 20px; cursor:pointer; background:linear-gradient(120deg,#FF7A3D,#E02F6B); }
#hud button.ghost { background:#2a2d35; padding:8px 16px; }
#hud button:focus-visible, #jumpbtn:focus-visible { outline:2px solid #eceef1; outline-offset:3px; }
#hint { background:rgba(21,22,26,.75); padding:6px 10px; border-radius:8px; text-align:center; max-width:calc(100vw - 32px); }
#stick { position:fixed; left:calc(22px + env(safe-area-inset-left, 0px)); bottom:calc(22px + env(safe-area-inset-bottom, 0px));
  width:120px; height:120px; border-radius:50%; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2);
  z-index:5; touch-action:none; }
#stick i { position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px; border-radius:50%; background:rgba(255,255,255,.32); }
#jumpbtn { position:fixed; right:calc(22px + env(safe-area-inset-right, 0px)); bottom:calc(36px + env(safe-area-inset-bottom, 0px));
  width:84px; height:84px; border-radius:50%; z-index:5; border:0; touch-action:none; color:#fff;
  font:700 14px "Space Grotesk",system-ui,sans-serif; background:linear-gradient(135deg,#FF7A3D,#E02F6B); }

<script>
  (function () {
    var lines = ["waking the robots up", "untangling cables", "overthinking the loading bar", "finding the football",
      "telling the DJ to turn it down", "almost. probably.", "the coder says 5 more minutes"], i = 0;
    var t = setInterval(function () {
      var el = document.getElementById("bootline");
      if (!el || document.getElementById("boot").classList.contains("done")) return clearInterval(t);
      el.textContent = lines[++i % lines.length];
    }, 1100);
    // if the 3D never arrives (CDN down, ancient phone), still show the words
    setTimeout(function () { var b = document.getElementById("boot"); if (b) b.classList.add("done"); }, 15000);
  })();
</script>

<script type="module">
// Robot: "RobotExpressive" by Tomás Laulhé (CC0), from the three.js examples.
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import * as SkeletonUtils from "three/addons/utils/SkeletonUtils.js";

const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const small = Math.min(innerWidth, innerHeight) < 700;
const CROWD = small ? 4 : 10;
const PLAYERS = small ? 4 : 6;
const R = small ? 12 : 20;                       // how far the crowd wanders
const PL = R * 0.5, PW = R * 0.3, GW = PW * 0.45; // pitch half-length, half-width, goal half-width
const COLORS = [0xe02f6b, 0x2fbf71, 0x9b6bff, 0xf6c445, 0xec5f9a, 0x38bdf8, 0xbfc5cf];
const TEAM = [0xff7a3d, 0x4f8cff];

const LINES = {
  crowd: ["started on a Terminator 2 console", "I deleted the dragon. still sad.", "2,217 KB of JS? not today",
    "the ERP knows who owes", "200 products, 8 currencies, 0 sleep", "have you tried restarting it?",
    "four years of tech support for this", "Gurugram traffic > my build time", "works on my machine",
    "is it centred yet?", "who deployed on friday", "did you clear the cache?", "that's a feature",
    "the client wants it bigger", "padding. more padding.", "19 november, they said", "ctrl+z ctrl+z ctrl+z",
    "the résumé is 7 KB now", "one more coffee", "did I lock the door?", "what if they hate the font",
    "was that 'ok' or 'ok.'?"],
  chill: ["what if CSS is... like, a feeling", "the cache is everywhere, man", "19 november is a state of mind",
    "ship it... tomorrow", "whoa. flexbox.", "who even needs semicolons", "the pixels are breathing"],
  gamer: ["GG, stuartboi#0702 wins", "one more match", "lag!! that was lag", "my Steam library judges me",
    "T2 console, never forget", "noob detected", "brb, respawning"],
  player: ["mine!", "pass!!", "offside!", "VAR!!", "my ball", "nutmeg!"],
  coder: ["who wrote this? oh. me.", "it compiled. I'm scared.", "undefined is not a function",
    "stack overflow is down?!", "git push --force (sorry)", "just one more console.log"],
  rage: ["RAGE QUIT", "why won't you CENTRE", "I hate CSS", "it worked 5 minutes ago!!"],
  dj: ["drop the bass", "this one's for the recruiters", "now playing: npm install", "lo-fi beats to debug to"],
  sleeper: ["Z z z", "5 more minutes", "dreaming in hex", "zzz... deploy... zzz"],
  selfie: ["for the gram", "LinkedIn post incoming", "#opentowork", "is my good side the left one?",
    "thought leadership pose", "humbled to announce..."],
  runner: ["COFFEE!!", "deadline is TODAY", "can't stop, won't stop", "4th cup, who's counting"],
  courier: ["your catalogue, sir", "200 products, coming through", "mind the box", "signed, sealed, deployed"],
  // the overthinkers
  pacer: ["did I lock the door?", "what if the recruiter saw the 404?", "should've said 'Regards'",
    "replaying that meeting from 2019", "what did they MEAN by 'interesting'?", "did I hit reply all??"],
  texter: ["seen 3 hours ago", "typing... stopped typing", "should I double text?", "'k.' what does 'k.' mean",
    "drafting reply v14", "they used a full stop. it's over."],
  decider: ["push it? no. yes. no.", "tabs or spaces... both?", "rename the variable? again?",
    "light mode? dark mode? ??", "let me sleep on it (x40)", "ok final answer: maybe"],
  thinker: ["what if the domain expires", "is 7 KB too small??", "what if nobody scrolls",
    "everything is fine (it isn't)", "but WHY did it work", "19 november... or 20th??"],
  spiral: ["but what if...", "hmm", "okay but what if", "spiralling, brb", "what if I'm the bug"],
  hit: ["ow", "my pixels!", "rude", "I was compiling!", "bug report filed", "HR!!"],
};
const ACTS = ["Wave", "Dance", "Jump", "ThumbsUp", "Yes", "No", "Sitting"];

const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];

/* ---------- scene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15161a);
scene.fog = new THREE.Fog(0x15161a, R * 2.4, R * 4.5);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 300);
const back = Math.max(1, 0.55 / camera.aspect);   // a little further out on tall phones, but not so far they shrink
camera.position.set(0, R * 0.62, R * 1.85).multiplyScalar(back);   // low, so you see faces, not head-tops
scene.fog.near *= back; scene.fog.far *= back;

// 360: drag or swipe to spin, pinch or scroll to zoom, it drifts round on its own.
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
Object.assign(controls, { enableDamping: true, enablePan: false, autoRotate: !still, autoRotateSpeed: 0.5,
  minDistance: R * 0.7, maxDistance: R * 3 * back, minPolarAngle: 0.95, maxPolarAngle: 1.42 });

scene.add(new THREE.HemisphereLight(0xffffff, 0x3a3d46, 2.2));
const sun = new THREE.DirectionalLight(0xffffff, 2.4);
sun.position.set(12, 30, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -R * 1.5, right: R * 1.5, top: R * 1.5, bottom: -R * 1.5 });
scene.add(sun);

const mat = c => new THREE.MeshStandardMaterial({ color: c });
const floor = new THREE.Mesh(new THREE.CircleGeometry(R * 5, 64), mat(0x23262d));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

/* ---------- the neighbourhood: buildings, trees, lamps, people, a parkour course ---------- */
const solids = [];   // boxes the player can stand on or bump into: { x, z, w, d, top }
const people = [];
let bodyI, headI;
{
  // one window texture, lit at random, shared by every building
  const wc = document.createElement("canvas"); wc.width = 64; wc.height = 128;
  const wg = wc.getContext("2d");
  wg.fillStyle = "#000"; wg.fillRect(0, 0, 64, 128);
  for (let y = 8; y < 120; y += 16) for (let x = 6; x < 60; x += 14)
    if (Math.random() < 0.55) { wg.fillStyle = Math.random() < 0.8 ? "#f6c445" : "#9fd3ff"; wg.fillRect(x, y, 8, 9); }
  const winTex = new THREE.CanvasTexture(wc);
  winTex.colorSpace = THREE.SRGBColorSpace;
  const NB = small ? 18 : 30;
  for (let i = 0; i < NB; i++) {
    const a = i / NB * Math.PI * 2 + rnd(-0.08, 0.08), d = rnd(R * 2.25, R * 2.8);
    const w = rnd(3, 6), h = rnd(4, 15), dd = rnd(3, 6);
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, dd), new THREE.MeshStandardMaterial({
      color: pick([0x2a2d35, 0x33363f, 0x3b4252, 0x2d2a33]), emissive: 0xffffff, emissiveMap: winTex, emissiveIntensity: 0.9 }));
    m.position.set(Math.cos(a) * d, h / 2, Math.sin(a) * d);
    m.rotation.y = -a;
    scene.add(m);
  }

  const trunkG = new THREE.CylinderGeometry(0.15, 0.2, 1.2, 6), leafG = new THREE.ConeGeometry(0.9, 2.2, 7);
  const trunkM = mat(0x5b4636), leafM = mat(0x2e6b47);
  for (let i = 0; i < (small ? 14 : 26); i++) {
    const a = rnd(0, Math.PI * 2), d = rnd(R * 1.4, R * 2.05);
    const t = new THREE.Group();
    const trunk = new THREE.Mesh(trunkG, trunkM); trunk.position.y = 0.6;
    const leaf = new THREE.Mesh(leafG, leafM); leaf.position.y = 2.1; leaf.castShadow = true;
    t.add(trunk, leaf);
    t.position.set(Math.cos(a) * d, 0, Math.sin(a) * d);
    t.scale.setScalar(rnd(0.8, 1.4));
    scene.add(t);
  }

  const postG = new THREE.CylinderGeometry(0.06, 0.08, 3, 6), bulbG = new THREE.SphereGeometry(0.18, 10, 8);
  const postM = mat(0x3b4252), bulbM = new THREE.MeshBasicMaterial({ color: 0xffd58a });
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * Math.PI * 2 + 0.3, d = R * 1.32;
    const post = new THREE.Mesh(postG, postM); post.position.set(Math.cos(a) * d, 1.5, Math.sin(a) * d);
    const bulb = new THREE.Mesh(bulbG, bulbM); bulb.position.set(post.position.x, 3.05, post.position.z);
    scene.add(post, bulb);
  }

  // the people out there: simple figures between the trees and the buildings, cheering on a loop
  const NP = small ? 40 : 90;
  bodyI = new THREE.InstancedMesh(new THREE.CapsuleGeometry(0.28, 0.7, 3, 8), new THREE.MeshStandardMaterial(), NP);
  headI = new THREE.InstancedMesh(new THREE.SphereGeometry(0.24, 10, 8), new THREE.MeshStandardMaterial(), NP);
  const shirt = [0xff7a3d, 0xe02f6b, 0x4f8cff, 0x2fbf71, 0x9b6bff, 0xf6c445, 0xbfc5cf, 0x38bdf8];
  const skin = [0xf1c9a5, 0xd9a37a, 0xb97b54, 0x8d5a3b];
  for (let i = 0; i < NP; i++) {
    const a = rnd(0, Math.PI * 2), d = rnd(R * 1.55, R * 2.15);
    people.push({ x: Math.cos(a) * d, z: Math.sin(a) * d, ph: rnd(0, 6.3), hop: Math.random() < 0.4 ? rnd(0.15, 0.35) : 0 });
    bodyI.setColorAt(i, new THREE.Color(pick(shirt)));
    headI.setColorAt(i, new THREE.Color(pick(skin)));
  }
  scene.add(bodyI, headI);

  // the parkour course: rising blocks round the east side, crates round the west
  const steps = [0.5, 1, 1.5, 2, 2.6, 2, 1.3, 0.6];
  steps.forEach((h, i) => {
    const a = -0.7 + i * 0.2, d = R * 1.2;
    const c = new THREE.Color(0xff7a3d).lerp(new THREE.Color(0xe02f6b), i / (steps.length - 1));
    const m = new THREE.Mesh(new THREE.BoxGeometry(1.7, h, 1.7), mat(c));
    m.position.set(Math.cos(a) * d, h / 2, Math.sin(a) * d);
    m.castShadow = m.receiveShadow = true;
    scene.add(m);
    solids.push({ x: m.position.x, z: m.position.z, w: 1.7, d: 1.7, top: h });
  });
  for (const [a, h] of [[Math.PI - 0.35, 1], [Math.PI - 0.15, 1], [Math.PI - 0.15, 2], [Math.PI + 0.1, 1], [Math.PI + 0.35, 1.6]]) {
    const d = R * 1.2, m = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1, 1.2), mat(0x8a6a4a));
    m.position.set(Math.cos(a) * d, h - 0.5, Math.sin(a) * d);
    m.castShadow = m.receiveShadow = true;
    scene.add(m);
    const s = solids.find(s => Math.abs(s.x - m.position.x) < 0.1 && Math.abs(s.z - m.position.z) < 0.1);
    if (s) s.top = Math.max(s.top, h); else solids.push({ x: m.position.x, z: m.position.z, w: 1.2, d: 1.2, top: h });
  }
}

// the pitch
const pitch = new THREE.Mesh(new THREE.PlaneGeometry(PL * 2, PW * 2), mat(0x2c4a36));
pitch.rotation.x = -Math.PI / 2; pitch.position.y = 0.01; pitch.receiveShadow = true;
scene.add(pitch);
const white = new THREE.MeshBasicMaterial({ color: 0xdfe6dc });
const half = new THREE.Mesh(new THREE.PlaneGeometry(0.08, PW * 2), white);
half.rotation.x = -Math.PI / 2; half.position.y = 0.02; scene.add(half);
const ring = new THREE.Mesh(new THREE.RingGeometry(PW * 0.38, PW * 0.38 + 0.08, 48), white);
ring.rotation.x = -Math.PI / 2; ring.position.y = 0.02; scene.add(ring);
for (const sx of [-1, 1]) {
  const g = new THREE.Group();
  const post = new THREE.BoxGeometry(0.1, 1.3, 0.1);
  for (const sz of [-1, 1]) { const p = new THREE.Mesh(post, white); p.position.set(0, 0.65, sz * GW); g.add(p); }
  const bar = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, GW * 2 + 0.1), white); bar.position.y = 1.3; g.add(bar);
  g.position.x = sx * PL; scene.add(g);
}
const ball = new THREE.Mesh(new THREE.SphereGeometry(0.3, 20, 14), mat(0xf4f4f4));
ball.castShadow = true; ball.position.set(0, 0.3, 0); scene.add(ball);
const ballV = new THREE.Vector2();
let goalPause = 0;

// the gamer's telly
const gamerAt = new THREE.Vector3(R * 0.36, 0, R * 0.62);
const tv = new THREE.Mesh(new THREE.BoxGeometry(2, 1.2, 0.15), mat(0x0d0e11));
tv.position.set(gamerAt.x, 1.1, gamerAt.z - 2.4); tv.castShadow = true; scene.add(tv);
const screenMat = new THREE.MeshBasicMaterial({ color: 0x4f8cff });
const screen = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 1), screenMat);
screen.position.set(0, 0, 0.08); tv.add(screen);
const stand = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.5, 0.15), mat(0x0d0e11));
stand.position.set(gamerAt.x, 0.25, gamerAt.z - 2.4); scene.add(stand);

// the chill corner
const chillAt = new THREE.Vector3(-R * 0.36, 0, R * 0.62);
const puffGeo = new THREE.SphereGeometry(0.12, 10, 8);
const puffs = [];

function fit() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener("resize", fit);

/* ---------- robots ---------- */
const bots = [];

function play(b, name, once, fade = 0.25) {
  const a = b.acts[name];
  a.reset();
  a.setLoop(once ? THREE.LoopOnce : THREE.LoopRepeat);
  a.clampWhenFinished = once;
  a.fadeIn(fade).play();
  if (b.cur && b.cur !== a) b.cur.fadeOut(fade);
  b.cur = a;
}
function say(b, text, ms = 2300) {
  b.bubble.textContent = text;
  b.bubble.hidden = false;
  b.sayUntil = performance.now() + ms;
}
function face(b, name, v) {
  if (b.head) b.head.morphTargetInfluences[b.head.morphTargetDictionary[name]] = v;
}
function calm(b) { face(b, "Surprised", 0); face(b, "Angry", 0); face(b, "Sad", 0); }

// robots that stay in one spot doing their thing; `every` = how often they have a moment
const SPEC = {
  gamer:   { clip: "Sitting" },
  chill:   { clip: "Sitting", sad: 0.55 },                        // the heavy-lidded look
  coder:   { clip: "Sitting", every: [9, 15], fit: () => "Punch", fitLines: "rage" },
  dj:      { clip: "Dance" },
  sleeper: { clip: "Death", once: true },
  selfie:  { clip: "Idle", every: [3, 6], fit: () => pick(["Wave", "ThumbsUp", "Yes"]) },
  texter:  { clip: "Sitting", sad: 0.4 },
  decider: { clip: "Idle", every: [1.8, 3], fit: () => pick(["Yes", "No"]) },   // can't settle on either
  thinker: { clip: "Sitting", sad: 1 },
};
const LOOPS = { runner: "Running", courier: "Walking", pacer: "Walking", spiral: "Walking" };

// what each kind of robot goes back to doing
function resume(b) {
  calm(b);
  const spec = SPEC[b.role];
  if (b.role === "crowd") {
    b.state = "walk"; b.run = Math.random() < 0.25; b.heading += rnd(-1.4, 1.4); b.timer = rnd(2, 6);
    play(b, b.run ? "Running" : "Walking", false);
  } else if (b.role === "player") {
    b.state = "chase"; play(b, "Running", false);
  } else if (LOOPS[b.role]) {
    b.state = "loop"; play(b, LOOPS[b.role], false);
  } else {
    b.state = "sit"; b.heading = b.homeHeading; b.root.position.copy(b.home);
    play(b, spec.clip, !!spec.once);
    if (spec.sad) face(b, "Sad", spec.sad);
    if (spec.every) b.fitIn = rnd(...spec.every);
  }
}
function act(b, name = pick(ACTS), ms) {
  b.state = "act";
  const looped = name === "Dance" || name === "Sitting";
  play(b, name, !looped);
  b.timer = ms || (looped ? rnd(2.5, 4.5) : 99);
}
function knockDown(b) {
  if (b.state === "down") return;
  b.state = "down"; b.timer = rnd(2.2, 3.2);
  face(b, "Surprised", 1);
  play(b, "Death", true, 0.15);
  say(b, pick(LINES.hit), 1600);
}
function punch(a, b) {
  a.state = "act"; a.timer = 99;
  a.heading = Math.atan2(b.root.position.x - a.root.position.x, b.root.position.z - a.root.position.z);
  face(a, "Angry", 1);
  play(a, "Punch", true, 0.1);
  setTimeout(() => knockDown(b), 380);
}

// stick a prop in the right hand, sized in world units whatever the bone's own scale is
function hold(b, prop) {
  const hand = b.root.getObjectByName("HandR") || b.root.getObjectByName("Hand.R");
  if (!hand) return;
  b.root.updateMatrixWorld(true);
  prop.scale.setScalar(1 / hand.getWorldScale(new THREE.Vector3()).x);
  hand.add(prop);
  return prop;
}

function makeBot(gltf, { role, color, pos, heading = rnd(0, Math.PI * 2), team = -1 }) {
  const root = SkeletonUtils.clone(gltf.scene);
  let head = null;
  root.traverse(o => {
    if (!o.isMesh) return;
    o.castShadow = true;
    o.material = o.material.clone();
    if (o.material.name === "Main") o.material.color = new THREE.Color(color);
    if (o.morphTargetDictionary && "Surprised" in o.morphTargetDictionary) head = o;
  });
  const size = rnd(0.45, 0.56);
  root.scale.setScalar(size);
  root.position.copy(pos);
  root.rotation.y = heading;
  scene.add(root);

  const mixer = new THREE.AnimationMixer(root);
  const acts = {};
  for (const clip of gltf.animations) acts[clip.name] = mixer.clipAction(clip);
  const bubble = document.createElement("div");
  bubble.className = "say"; bubble.hidden = true;
  document.body.appendChild(bubble);

  const b = { root, mixer, acts, head, bubble, role, team, size, cur: null, heading, homeHeading: heading,
    home: pos.clone(), state: "", timer: 0, run: false, sayUntil: 0, cooldown: rnd(0, 3), talk: rnd(1, 6), kick: 0 };
  root.userData.bot = b;
  mixer.addEventListener("finished", e => { if (e.action === b.cur && b.state === "act") resume(b); });
  bots.push(b);
  resume(b);
  mixer.update(rnd(0, 2));
  return b;
}

let joint = null;
const lights = [], marks = [], rain = { cloud: null, drops: [] };

const bar = document.getElementById("bar");
bar.style.width = "15%";   // scripts are in
new GLTFLoader().load("robot.glb", gltf => {
  for (let i = 0; i < CROWD; i++) {
    const a = rnd(0, Math.PI * 2), r = rnd(PW * 1.3, R);

  }
  for (let i = 0; i < PLAYERS; i++) {
    const team = i % 2;
    makeBot(gltf, { role: "player", team, color: TEAM[team],
      pos: new THREE.Vector3((team ? 1 : -1) * rnd(1, PL * 0.8), 0, rnd(-PW, PW) * 0.8) });
  }

  // the gamer, facing the telly, controller in hand
  const gamer = makeBot(gltf, { role: "gamer", color: 0x4f8cff, pos: gamerAt.clone(), heading: Math.PI });
  hold(gamer, new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.08, 0.24), mat(0x1b1c20)));

  // the chill one, sitting alone, smoke drifting up
  const chill = makeBot(gltf, { role: "chill", color: 0x2fbf71, pos: chillAt.clone(), heading: 0.6 });

  const ember = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 6), new THREE.MeshBasicMaterial({ color: 0xff7a3d }));
  ember.position.x = 0.22; j.add(ember);
  hold(chill, j);
  joint = ember;

  // a world-space prop in front of a robot, `dist` along the way it faces

  const box = (w, h, d, c, at, glow) => {

  box(2.2, 0.9, 0.8, 0x1b1c20, ahead(dj, 1.2, 0.45)).rotation.y = dj.homeHeading;
  for (let i = -1; i <= 1; i++) {
    const l = box(0.35, 0.35, 0.35, 0xffffff, new THREE.Vector3(dj.home.x + i * 1.1, 2.9, dj.home.z - 0.6), true);

  // the sleeper: flat out, mid-shift

  // the selfie one: phone out, posing for LinkedIn
  const selfie = makeBot(gltf, { role: "selfie", color: 0xf6c445, pos: new THREE.Vector3(R * 0.82, 0, -R * 0.05), heading: -1.2 });
  hold(selfie, new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.28, 0.03), mat(0x111111)));

  // the coffee runner: laps, cup in hand
  const runner = makeBot(gltf, { role: "runner", color: 0xff7a3d, pos: new THREE.Vector3(-R * 0.8, 0, -R * 0.05) });
  Object.assign(runner, { ang: 0, w: 1.7, rad: 1.8 });
  const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.08, 0.24, 10), mat(0xf2efe6));
  hold(runner, cup);

  // the courier: one Pixel Pull block, carried back and forth for ever
  const courier = makeBot(gltf, { role: "courier", color: 0x38bdf8, pos: new THREE.Vector3(-R * 0.25, 0, R * 0.88) });
  courier.b = new THREE.Vector3(R * 0.25, 0, R * 0.88);
  Object.assign(courier, { toB: true, v: 1.5 });
  hold(courier, new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), mat(0xe8573f)));

  /* ----- the overthinkers ----- */

  // paces the same few steps, replaying everything
  const pacer = makeBot(gltf, { role: "pacer", color: 0xbfc5cf, pos: new THREE.Vector3(R * 0.62, 0, R * 0.15) });
  Object.assign(pacer, { b: new THREE.Vector3(R * 0.62, 0, -R * 0.3), toB: true, v: 1.1 });

  // staring at a phone, waiting for a reply that is not coming
  const texter = makeBot(gltf, { role: "texter", color: 0x9b6bff, pos: new THREE.Vector3(-R * 0.82, 0, R * 0.6), heading: 0.9 });
  hold(texter, new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.28, 0.03), mat(0x111111)));

  // yes, no, yes, no, yes...
  makeBot(gltf, { role: "decider", color: 0xf6c445, pos: new THREE.Vector3(R * 0.22, 0, -R * 0.45), heading: 0.3 });

  // sits under its own rain cloud

  const cloud = new THREE.Group();
  for (const [x, y, s] of [[0, 0, 0.45], [0.45, -0.05, 0.36], [-0.45, -0.05, 0.36], [0.2, 0.2, 0.34], [-0.22, 0.18, 0.3]]) {
    const c = new THREE.Mesh(new THREE.SphereGeometry(s, 12, 10), mat(0x6b7280));

  cloud.position.set(thinker.home.x, 3.6, thinker.home.z);
  scene.add(cloud);
  rain.cloud = cloud;
  const dropGeo = new THREE.BoxGeometry(0.03, 0.22, 0.03), dropMat = new THREE.MeshBasicMaterial({ color: 0x9fd3ff });
  for (let i = 0; i < 18; i++) {
    const d = new THREE.Mesh(dropGeo, dropMat);
    d.position.set(cloud.position.x + rnd(-0.6, 0.6), rnd(0, 3.3), cloud.position.z + rnd(-0.35, 0.35));
    scene.add(d); rain.drops.push(d);
  }

  // walks in circles while question marks circle its head
  const spiral = makeBot(gltf, { role: "spiral", color: 0xec5f9a, pos: new THREE.Vector3(-R * 0.85, 0, -R * 0.5) });
  Object.assign(spiral, { ang: 0, w: 0.9, rad: 1.2 });
  const qc = document.createElement("canvas"); qc.width = qc.height = 64;
  const g = qc.getContext("2d");
  g.font = "700 54px Space Grotesk, sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillStyle = "#FF7A3D"; g.fillText("?", 32, 34);
  const qMat = new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(qc) });
  for (let i = 0; i < 3; i++) {
    const q = new THREE.Sprite(qMat); q.scale.setScalar(0.55); scene.add(q);
    marks.push({ q, of: spiral, phase: i * Math.PI * 2 / 3 });
  }

  if (still) { controls.update(); renderer.render(scene, camera); }
  // compile every shader now, behind the preloader, so the first real frame doesn't stall
  renderer.compileAsync(scene, camera).catch(() => {}).then(() => {
    bar.style.width = "100%";
    requestAnimationFrame(() => requestAnimationFrame(() => {
      const boot = document.getElementById("boot");
      boot.classList.add("done");
      setTimeout(() => boot.remove(), 600);
    }));
  });
}, e => { if (e.total) bar.style.width = 15 + 70 * e.loaded / e.total + "%"; },
   () => document.getElementById("boot").classList.add("done"));   // never leave anyone stuck on the loader

/* ---------- tap a robot: it falls over (or, in pick mode, becomes you). drag: it spins. ---------- */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener("pointerdown", e => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener("pointerup", e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;  // that was a drag
  ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(bots.map(b => b.root), true)[0];
  let o = hit && hit.object;
  while (o && !o.userData.bot) o = o.parent;
  if (!o && picking) {
    // robots are small and they move: in pick mode, take the nearest one to the tap
    let best = 70;
    for (const b of bots) {
      tmp.copy(b.root.position).setY(1).project(camera);
      const d = Math.hypot((tmp.x + 1) / 2 * innerWidth - e.clientX, (1 - tmp.y) / 2 * innerHeight - e.clientY);
      if (tmp.z < 1 && d < best) { best = d; o = b.root; }
    }
  }
  if (!o) return;
  if (picking) take(o.userData.bot);
  else if (o.userData.bot !== me) knockDown(o.userData.bot);
});

/* ---------- play mode: pick a robot, drive it ---------- */
const touch = matchMedia("(pointer: coarse)").matches;
const hud = { play: document.getElementById("play"), quit: document.getElementById("quit"), hint: document.getElementById("hint"),
  stick: document.getElementById("stick"), jump: document.getElementById("jumpbtn") };
const keys = {};
const stickV = new THREE.Vector2();
const startCam = camera.position.clone(), startTarget = controls.target.clone();
let picking = false, me = null, jumpQueued = false, hintTimer = 0;
const marker = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.45, 4), new THREE.MeshBasicMaterial({ color: 0xff7a3d }));
marker.rotation.x = Math.PI; marker.visible = false; scene.add(marker);
if (still) hud.play.hidden = true;

function hint(text, ms) {
  hud.hint.textContent = text; hud.hint.hidden = false;
  clearTimeout(hintTimer);
  if (ms) hintTimer = setTimeout(() => { hud.hint.hidden = true; }, ms);
}

hud.play.addEventListener("click", () => {
  hud.play.blur();
  picking = !picking;
  hud.play.textContent = picking ? "Cancel" : "Play as a robot";
  if (picking) { controls.autoRotate = false; hint("tap any robot to play as it"); }
  else { controls.autoRotate = true; hud.hint.hidden = true; }
});
hud.quit.addEventListener("click", () => { hud.quit.blur(); release(); });

function take(b) {
  picking = false;
  if (me) release();
  me = b;
  b.prevRole = b.role;
  b.role = "me"; b.state = "me";
  Object.assign(b, { vy: 0, air: false, flip: 0, jumps: 0, clip: "" });
  b.root.rotation.order = "YXZ";
  calm(b);
  say(b, pick(["finally, freedom", "where am I going?", "wheee", "I have legs?!", "this is my moment"]), 1800);
  controls.autoRotate = false;
  controls.minDistance = 4; controls.maxDistance = 16;
  // drop the camera in behind the robot
  const p = b.root.position;
  controls.target.set(p.x, p.y + 1.2, p.z);
  const far = 8 * back;   // further back on tall phone screens
  camera.position.set(p.x - Math.sin(b.heading) * far, p.y + 4.5 * back, p.z - Math.cos(b.heading) * far);
  marker.visible = true;
  hud.play.hidden = true; hud.quit.hidden = false;
  hud.stick.hidden = hud.jump.hidden = !touch;
  hint(touch ? "stick to move · Jump · tap Jump twice to flip" : "W A S D to move · Space to jump · Space twice to flip · Esc to exit",
    touch ? 4000 : 0);
}

function release() {
  if (!me) return;
  const b = me;
  me = null;
  b.root.rotation.x = 0;
  b.role = b.prevRole;
  b.root.position.y = 0;
  resume(b);
  marker.visible = false;
  controls.minDistance = R * 0.7; controls.maxDistance = R * 3 * back;
  controls.target.copy(startTarget); camera.position.copy(startCam);
  controls.autoRotate = true;
  hud.play.hidden = false; hud.play.textContent = "Play as a robot"; hud.quit.hidden = true;
  hud.stick.hidden = hud.jump.hidden = true; hud.hint.hidden = true;
}

const MOVE = { KeyW: [0, 1], ArrowUp: [0, 1], KeyS: [0, -1], ArrowDown: [0, -1], KeyA: [-1, 0], ArrowLeft: [-1, 0], KeyD: [1, 0], ArrowRight: [1, 0] };
addEventListener("keydown", e => {
  if (e.code === "Escape") { if (me) release(); else if (picking) hud.play.click(); return; }
  if (!me) return;
  if (e.code === "Space") { e.preventDefault(); if (!e.repeat) jumpQueued = true; }
  if (MOVE[e.code]) { e.preventDefault(); keys[e.code] = true; }
});
addEventListener("keyup", e => { keys[e.code] = false; });
addEventListener("blur", () => { for (const k in keys) keys[k] = false; });

// touch: a thumb-stick on the left, a jump button on the right
let stickId = null;
hud.stick.addEventListener("pointerdown", e => { stickId = e.pointerId; hud.stick.setPointerCapture(stickId); moveStick(e); });
hud.stick.addEventListener("pointermove", e => { if (e.pointerId === stickId) moveStick(e); });
const endStick = e => { if (e.pointerId !== stickId) return; stickId = null; stickV.set(0, 0); hud.stick.firstElementChild.style.transform = ""; };
hud.stick.addEventListener("pointerup", endStick);
hud.stick.addEventListener("pointercancel", endStick);
function moveStick(e) {
  const r = hud.stick.getBoundingClientRect();
  stickV.set(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
  if (stickV.length() > 44) stickV.setLength(44);
  hud.stick.firstElementChild.style.transform = `translate(${stickV.x}px, ${stickV.y}px)`;
  stickV.divideScalar(44);
}
hud.jump.addEventListener("pointerdown", e => { e.preventDefault(); jumpQueued = true; });

// how high is the floor here: the top of any block underneath that you could step onto
function groundAt(x, z, y) {
  let g = 0;
  for (const s of solids)
    if (Math.abs(x - s.x) < s.w / 2 + 0.2 && Math.abs(z - s.z) < s.d / 2 + 0.2 && s.top <= y + 0.45) g = Math.max(g, s.top);
  return g;
}
function blocked(x, z, y) {
  for (const s of solids)
    if (Math.abs(x - s.x) < s.w / 2 + 0.35 && Math.abs(z - s.z) < s.d / 2 + 0.35 && s.top > y + 0.45) return true;
  return false;
}

const fwd = new THREE.Vector3(), mv = new THREE.Vector3();
function drive(b, dt) {
  const p = b.root.position, ox = p.x, oy = p.y, oz = p.z;

  // input, relative to where the camera is looking
  let ix = stickV.x, iz = -stickV.y;
  for (const k in MOVE) if (keys[k]) { ix += MOVE[k][0]; iz += MOVE[k][1]; }
  camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
  mv.set(fwd.x * iz - fwd.z * ix, 0, fwd.z * iz + fwd.x * ix);
  const moving = mv.lengthSq() > 0.02;
  if (moving) {
    if (mv.length() > 1) mv.normalize();
    b.heading = Math.atan2(mv.x, mv.z);
    const v = 5.2 * dt;
    if (!blocked(p.x + mv.x * v, p.z, p.y)) p.x += mv.x * v;
    if (!blocked(p.x, p.z + mv.z * v, p.y)) p.z += mv.z * v;
    const r = Math.hypot(p.x, p.z), lim = R * 2.05;   // the buildings are the edge of the world
    if (r > lim) { p.x *= lim / r; p.z *= lim / r; }
  }

  // jump, then a second press in the air for the parkour flip
  if (jumpQueued) {
    jumpQueued = false;
    if (!b.air) { b.vy = 7.5; b.air = true; b.jumps = 1; play(b, "Jump", true, 0.1); b.clip = "Jump"; }
    else if (b.jumps === 1) {
      b.vy = Math.max(b.vy, 8.5); b.jumps = 2; b.flip = 0.001;
      say(b, pick(["PARKOUR!", "parkour!!", "hold my oil", "nailed it (probably)"]), 1300);
    }
  }
  b.vy -= 22 * dt;
  p.y += b.vy * dt;
  const g = groundAt(p.x, p.z, oy);
  if (p.y <= g) {
    p.y = g;
    if (b.air) { b.air = false; b.flip = 0; b.root.rotation.x = 0; b.clip = ""; }
    b.vy = 0;
  } else if (!b.air && p.y > g + 0.05) { b.air = true; b.jumps = 1; }   // walked off an edge
  if (b.flip > 0) {
    b.flip += dt * 1.7;
    b.root.rotation.x = Math.min(b.flip, 1) * Math.PI * 2;
    if (b.flip >= 1) b.flip = -1;     // one full turn, then hold upright
  }

  if (!b.air) {
    const want = moving ? "Running" : "Idle";
    if (b.clip !== want) { play(b, want, false, 0.18); b.clip = want; }
  }

  // run into people and they fall over; run into the ball and you kick it
  for (const o of bots) {
    if (o === b || o.state === "down" || SPEC[o.role] || !moving) continue;
    const dx = o.root.position.x - p.x, dz = o.root.position.z - p.z;
    if (dx * dx + dz * dz < 1.4 && Math.abs(p.y) < 0.6 && (b.bumpCd = (b.bumpCd || 0) - dt) <= 0) {
      knockDown(o); b.bumpCd = 0.6;
      if (Math.random() < 0.4) say(b, pick(["sorry!", "coming through", "my bad", "watch it!"]), 1200);
    }
  }
  const bp = ball.position;
  if (goalPause <= 0 && Math.hypot(bp.x - p.x, bp.z - p.z) < 0.9 && p.y < 0.5) {
    ballV.set(Math.sin(b.heading), Math.cos(b.heading)).multiplyScalar(moving ? 9 : 4);
  }

  // the camera comes along for the ride, keeping whatever angle you've dragged it to
  const dx = p.x - ox, dy = p.y - oy, dz = p.z - oz;
  controls.target.x += dx; controls.target.z += dz; camera.position.x += dx; camera.position.z += dz;
  const ty = p.y + 1.2, sy = (ty - controls.target.y) * Math.min(1, dt * 6);
  controls.target.y += sy; camera.position.y += sy;
  marker.position.set(p.x, p.y + b.size * 6.2 + Math.sin(performance.now() / 200) * 0.08, p.z);
}

/* ---------- football ---------- */
function goal(team) {
  goalPause = 2.8;
  ballV.set(0, 0);
  for (const b of bots) if (b.role === "player" && b.state !== "down") {
    if (b.team === team) { act(b, "Dance", 2.6); if (Math.random() < 0.6) say(b, "GOAL!!", 2000); }
    else { act(b, Math.random() < 0.5 ? "No" : "Sitting", 2.6); face(b, "Sad", 1); }
  }
}
function football(dt) {
  if (goalPause > 0) {
    goalPause -= dt;
    if (goalPause <= 0) { ball.position.set(0, 0.3, 0); ballV.set(rnd(-1, 1), rnd(-1, 1)); }
    return;
  }
  const p = ball.position;
  p.x += ballV.x * dt; p.z += ballV.y * dt;
  ballV.multiplyScalar(Math.max(0, 1 - 0.9 * dt));
  ball.rotation.z -= ballV.x * dt / 0.3;
  ball.rotation.x += ballV.y * dt / 0.3;
  if (Math.abs(p.z) > PW - 0.3) { p.z = Math.sign(p.z) * (PW - 0.3); ballV.y *= -0.7; }
  if (Math.abs(p.x) > PL) {
    if (Math.abs(p.z) < GW) return goal(p.x > 0 ? 0 : 1);   // team 0 attacks +x
    p.x = Math.sign(p.x) * PL; ballV.x *= -0.7;
  }
}
function chase(b, dt) {
  const p = b.root.position, bp = ball.position;
  b.kick -= dt;
  const dx = bp.x - p.x, dz = bp.z - p.z, d = Math.hypot(dx, dz);
  if (d > 0.9) {
    b.heading = Math.atan2(dx, dz);
    const v = 3.1;
    p.x += Math.sin(b.heading) * v * dt;
    p.z += Math.cos(b.heading) * v * dt;
    p.x = THREE.MathUtils.clamp(p.x, -PL * 1.1, PL * 1.1);
    p.z = THREE.MathUtils.clamp(p.z, -PW * 1.1, PW * 1.1);
  } else if (b.kick <= 0 && goalPause <= 0) {
    const gx = b.team === 0 ? PL : -PL;
    const k = new THREE.Vector2(gx - bp.x, rnd(-GW, GW) - bp.z).normalize().rotateAround(new THREE.Vector2(), rnd(-0.6, 0.6));
    ballV.copy(k.multiplyScalar(rnd(5, 9)));
    b.kick = 0.9;
    if (Math.random() < 0.18) say(b, pick(LINES.player), 1400);
  }
}

/* ---------- loop ---------- */
const clock = new THREE.Clock();
const tmp = new THREE.Vector3();
const dummy = new THREE.Object3D();
let puffClock = 0, screenClock = 0;
function tick() {
  requestAnimationFrame(tick);
  if (document.hidden) { clock.getDelta(); return; }
  const dt = Math.min(clock.getDelta(), 0.05);
  const now = performance.now();
  controls.update();
  football(dt);

  for (const b of bots) {
    b.timer -= dt; b.cooldown -= dt; b.talk -= dt;
    const p = b.root.position;
    if (b.state === "me") {
      drive(b, dt);
    } else if (b.state === "walk") {
      const v = (b.run ? 4.2 : 1.6) * b.size * 2;
      if (Math.hypot(p.x, p.z) > R) b.heading = Math.atan2(-p.x, -p.z) + rnd(-0.6, 0.6);  // back to the middle
      p.x += Math.sin(b.heading) * v * dt;
      p.z += Math.cos(b.heading) * v * dt;
      if (b.timer <= 0) {
        if (Math.random() < 0.55) { act(b); if (Math.random() < 0.6) say(b, pick(LINES.crowd)); }
        else resume(b);
      }
    } else if (b.state === "chase") {
      chase(b, dt);
    } else if (b.state === "sit") {
      if (b.talk <= 0) { say(b, pick(LINES[b.role]), 2600); b.talk = rnd(5, 10); }
      const spec = SPEC[b.role];
      if (spec.every && (b.fitIn -= dt) <= 0) {
        act(b, spec.fit());
        if (spec.fitLines) { face(b, "Angry", 1); say(b, pick(LINES[spec.fitLines]), 1800); }
      }
    } else if (b.state === "loop") {
      if (b.ang !== undefined) {                       // laps of a small circle, forever
        b.ang += b.w * dt;
        p.set(b.home.x + Math.cos(b.ang) * b.rad, 0, b.home.z + Math.sin(b.ang) * b.rad);
        b.heading = Math.atan2(-Math.sin(b.ang), Math.cos(b.ang));
      } else {                                         // back and forth between two spots
        const t = b.toB ? b.b : b.home;
        const dx = t.x - p.x, dz = t.z - p.z, d = Math.hypot(dx, dz);
        if (d < 0.3) { b.toB = !b.toB; say(b, pick(LINES[b.role]), 1800); }
        else { b.heading = Math.atan2(dx, dz); p.x += dx / d * b.v * dt; p.z += dz / d * b.v * dt; }
      }
      if (b.talk <= 0) { say(b, pick(LINES[b.role]), 1800); b.talk = rnd(6, 12); }
    } else if ((b.state === "act" || b.state === "down") && b.timer <= 0) {
      resume(b);
    }
    const d = Math.atan2(Math.sin(b.heading - b.root.rotation.y), Math.cos(b.heading - b.root.rotation.y));
    b.root.rotation.y += d * Math.min(1, dt * 8);
    b.mixer.update(dt);

    if (!b.bubble.hidden) {
      tmp.set(p.x, p.y + b.size * 5.4, p.z).project(camera);
      if (now > b.sayUntil || tmp.z > 1) b.bubble.hidden = now > b.sayUntil;
      b.bubble.style.visibility = tmp.z > 1 ? "hidden" : "visible";   // behind the camera after a spin
      b.bubble.style.left = (tmp.x + 1) / 2 * innerWidth + "px";
      b.bubble.style.top = (1 - tmp.y) / 2 * innerHeight + "px";
    }
  }

  // nobody stands inside anybody: moving robots get pushed apart, the ones with a fixed spot hold their ground
  const MIN = 1.5;
  for (let i = 0; i < bots.length; i++) for (let j = i + 1; j < bots.length; j++) {
    const a = bots[i], b = bots[j], pa = a.root.position, pb = b.root.position;
    let dx = pb.x - pa.x, dz = pb.z - pa.z;
    const d = Math.hypot(dx, dz);
    if (d >= MIN) continue;
    if (d < 1e-3) { dx = 1; dz = 0; } else { dx /= d; dz /= d; }
    const ma = !SPEC[a.role], mb = !SPEC[b.role];
    if (!ma && !mb) continue;
    const push = MIN - Math.max(d, 1e-3), sa = ma && mb ? 0.5 : ma ? 1 : 0, sb = ma && mb ? 0.5 : mb ? 1 : 0;
    pa.x -= dx * push * sa; pa.z -= dz * push * sa;
    pb.x += dx * push * sb; pb.z += dz * push * sb;
  }

  // the crowd bumping into each other: usually a polite swerve, sometimes a punch
  for (let i = 0; i < bots.length; i++) for (let j = i + 1; j < bots.length; j++) {
    const a = bots[i], b = bots[j];
    if (a.state !== "walk" || b.state !== "walk") continue;
    const dx = b.root.position.x - a.root.position.x, dz = b.root.position.z - a.root.position.z;
    if (dx * dx + dz * dz > 2.2) continue;
    if (a.cooldown <= 0 && Math.random() < 0.3) { punch(a, b); a.cooldown = 8; }
    else { a.heading += 1.6; b.heading -= 1.6; }
  }

  // smoke off the joint, drifting up and fading
  puffClock -= dt;
  if (joint && puffClock <= 0 && puffs.length < 40) {
    puffClock = 0.22;
    const m = new THREE.Mesh(puffGeo, new THREE.MeshBasicMaterial({ color: 0xcfd3da, transparent: true, opacity: 0.55, depthWrite: false }));
    joint.getWorldPosition(m.position);
    m.userData.v = new THREE.Vector3(rnd(-0.15, 0.15), rnd(0.5, 0.8), rnd(-0.15, 0.15));
    m.userData.age = 0;
    scene.add(m); puffs.push(m);
  }
  for (let i = puffs.length - 1; i >= 0; i--) {
    const m = puffs[i];
    m.userData.age += dt;
    m.position.addScaledVector(m.userData.v, dt);
    m.scale.setScalar(1 + m.userData.age * 2.2);
    m.material.opacity = 0.55 * (1 - m.userData.age / 3);
    if (m.userData.age > 3) { scene.remove(m); m.material.dispose(); puffs.splice(i, 1); }
  }

  // the people out there cheer, some of them hopping
  for (let i = 0; i < people.length; i++) {
    const h = people[i], y = h.hop ? Math.max(0, Math.sin(now / 260 + h.ph)) * h.hop : 0;
    dummy.position.set(h.x, 0.63 + y, h.z); dummy.updateMatrix(); bodyI.setMatrixAt(i, dummy.matrix);
    dummy.position.y = 1.42 + y; dummy.updateMatrix(); headI.setMatrixAt(i, dummy.matrix);
  }
  bodyI.instanceMatrix.needsUpdate = headI.instanceMatrix.needsUpdate = true;

  // question marks orbit the spiralling one; the rain cloud rains
  for (const m of marks) {
    const a = now / 700 + m.phase, hp = m.of.root.position;
    m.q.position.set(hp.x + Math.cos(a) * 0.8, 3.1 + Math.sin(a * 2) * 0.15, hp.z + Math.sin(a) * 0.8);
  }
  if (rain.cloud) {
    rain.cloud.position.x += Math.sin(now / 900) * 0.002;
    for (const d of rain.drops) {
      d.position.y -= 6 * dt;
      if (d.position.y < 0) {
        d.position.set(rain.cloud.position.x + rnd(-0.6, 0.6), 3.3, rain.cloud.position.z + rnd(-0.35, 0.35));
      }
    }
  }

  // the telly flickers like a game is on
  screenClock -= dt;
  if (screenClock <= 0) {
    screenClock = rnd(0.12, 0.4);
    screenMat.color.setHSL(Math.random(), 0.7, 0.55);
    for (const l of lights) l.material.color.setHSL(Math.random(), 0.9, 0.6);
  }

  renderer.render(scene, camera);
}
if (!still) tick();
</script>
